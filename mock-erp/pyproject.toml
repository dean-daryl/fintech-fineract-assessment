[project]
name = "mock-erp"
version = "0.1.0"
description = "Mock ERP: chart of accounts and journal entries"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2.3",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.mypy]
strict = true
packages = ["app", "tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
