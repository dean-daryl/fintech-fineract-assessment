name: fineract-assessment

services:
  db:
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      FINERACT_DB_PASSWORD: ${FINERACT_DB_PASSWORD:?set in .env}
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD:?set in .env}
      INTEGRATION_DB_PASSWORD: ${INTEGRATION_DB_PASSWORD:?set in .env}
    volumes:
      # postgres 18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      # host 5433 avoids clashing with a local postgres on 5432; containers use db:5432
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  fineract:
    build:
      context: fineract-customization
    image: fineract-custom:local
    env_file:
      - fineract/configuration/fineract.env
    environment:
      FINERACT_HIKARI_PASSWORD: ${FINERACT_DB_PASSWORD:?set in .env}
      FINERACT_DEFAULT_TENANTDB_PWD: ${FINERACT_DB_PASSWORD:?set in .env}
      FINERACT_DEFAULT_MASTER_PASSWORD: ${FINERACT_DEFAULT_MASTER_PASSWORD:?set in .env}
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    ports:
      - "8443:8443"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:8443/fineract-provider/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # first boot runs every Liquibase changeset
      start_period: 600s
      start_interval: 5s

  mock-erp:
    build:
      context: mock-erp
    environment:
      DATABASE_URL: postgresql://erp:${ERP_DB_PASSWORD:?set in .env}@db:5432/erp
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  integration-service:
    build:
      context: integration-service
    environment:
      DATABASE_URL: postgresql://integration:${INTEGRATION_DB_PASSWORD:?set in .env}@db:5432/integration
      FINERACT_BASE_URL: https://fineract:8443/fineract-provider/api/v1
      ERP_BASE_URL: http://mock-erp:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      fineract:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
